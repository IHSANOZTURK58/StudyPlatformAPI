services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: study_platform_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - study-network

  minio:
    image: minio/minio:latest
    container_name: study_platform_minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - study-network

  api:
    build: .
    container_name: study_platform_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StudyPlatformDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      JwtSettings__Key: ${JWT_KEY}
      EmailSettings__SenderPassword: ${EMAIL_PASSWORD}
      EmailSettings__SenderEmail: ${EMAIL_SENDER}
    depends_on:
      - sqlserver
      - minio
    networks:
      - study-network

volumes:
  minio_data:

networks:
  study-network:
    driver: bridge